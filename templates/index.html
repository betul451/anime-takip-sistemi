<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d0f17; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .navbar { background-color: #161b2e; border-bottom: 2px solid #00f0ff; }
        .anime-card { 
            background: rgba(22, 27, 46, 0.7); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 240, 255, 0.2); 
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .anime-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
        }
        .btn-cyber { background-color: #00f0ff; color: #000; font-weight: 600; border: none; }
        .btn-cyber:hover { background-color: #fcee0a; color: #000; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/" style="color: #00f0ff;">🎌 ANIME TRACKER</a>
    <form class="d-flex" action="/" method="GET">
      <input class="form-control me-2 bg-dark text-light border-secondary" type="search" name="q" placeholder="Anime ara..." value="{{ arama }}">
      <button class="btn btn-cyber" type="submit">Ara</button>
    </form>
  </div>
</nav>

<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold" style="color: #fcee0a;">🔥 En Yüksek Puanlı Animeler</h3>
        <span class="badge bg-dark border border-secondary">{{ animeler|length }} Anime Listelendi</span>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">
        {% for a in animeler %}
        <div class="col">
            <div class="card anime-card h-100">
                <img src="{{ a.PosterURL or 'https://via.placeholder.com/300x400' }}" class="card-img-top" style="height: 280px; object-fit: cover;" alt="{{ a.Baslik }}">
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="card-title text-truncate fw-bold mb-1" title="{{ a.Baslik }}">{{ a.Baslik }}</h6>
                    <small class="text-secondary mb-3">{{ a.Format or 'TV' }} • {{ a.BolumSayisi or '?' }} Bölüm</small>
                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="badge bg-warning text-dark fw-bold">★ {{ a.OrtalamaPuan or '0.0' }}</span>
                        <a href="#" class="btn btn-sm btn-cyber">İncele</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
